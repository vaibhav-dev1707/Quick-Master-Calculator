<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick-Master-Calculator</title>
    <link rel="stylesheet" href="calculator.css" />
  </head>

  <body>
    <div class="calculator">
      <!-- Display -->
      <input type="text" id="display" disabled />
      
      <button class="toggle-btn" onclick="toggleScientific()">⌄</button>

      <div id="scientific" class="scientific">
        
        <button onclick="squareRoot()">√</button>
        <button onclick="press('Math.PI')">π</button>
        <button onclick="press('**')">^</button>
        <button onclick="factorial()">!</button>
        
        <button onclick="press('sin(')">sin</button>
        <button onclick="press('cos(')">cos</button>
        <button onclick="press('tan(')">tan</button>
        <button onclick="press('Math.E')">e</button>

        <button onclick="press('sec(')">sec</button>
        <button onclick="press('cosec(')">cosec</button>
        <button onclick="press('cot(')">cot</button>
        <button onclick="press('ln(')">ln</button>

        <button onclick="press('log(')">log</button>
        <button class="func">Rad</button>
        <button class="func">Inv</button>
        <button onclick="toggleSign()">±</button>
      </div>

      <div class="buttons">
        <button class="ac" onclick="clearDisplay()">AC</button>
        <button onclick="addBracket()">()</button>
        <button onclick="press('%')">%</button>
        <button onclick="press('/')">÷</button>

        <button onclick="press(7)">7</button>
        <button onclick="press(8)">8</button>
        <button onclick="press(9)">9</button>
        <button onclick="press('*')">×</button>

        <button onclick="press(4)">4</button>
        <button onclick="press(5)">5</button>
        <button onclick="press(6)">6</button>
        <button onclick="press('-')">−</button>

        <button onclick="press(1)">1</button>
        <button onclick="press(2)">2</button>
        <button onclick="press(3)">3</button>
        <button onclick="press('+')">+</button>

        <button class="zero" onclick="press(0)">0</button>
        <button onclick="press('.')">.</button>
        <button onclick="backspace()">⌫</button>
        <button class="equal" onclick="calculate()">=</button>
      </div>
    </div>

    <script src="calculator.js"></script>
  </body>
</html>
